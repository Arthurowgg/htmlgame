# ============================================================================
#  OMNI CLASH — build OmniClash-Setup.exe on a Windows runner and attach it
#  to the matching GitHub Release.
#
#  Triggers:
#    - pushing a tag: omni-v* (e.g. omni-v1.0.0)
#    - manual run (workflow_dispatch) with an optional release tag
#
#  Local build (on Windows): python setup/build_windows_setup.py
# ============================================================================
name: Build OmniClash Setup (Windows)

on:
  push:
    tags:
      - "omni-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new release tag (e.g. omni-v1.0.0). Leave empty to only upload artifact."
        required: false
        default: ""
      create_release:
        description: "Create/update a GitHub Release and attach the exe"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  build-windows:
    name: Build OmniClash-Setup.exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow
          # tkinter ships with the official Windows Python on GitHub-hosted runners

      - name: Build OmniClash-Setup.exe
        id: build
        shell: bash
        run: |
          set -o pipefail
          python setup/build_windows_setup.py 2>&1 | tee build.log
          BUILD=$?
          if [ $BUILD -ne 0 ]; then
            echo "build_status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "build_status=ok" >> "$GITHUB_OUTPUT"

      - name: Diagnostics → step summary (always)
        if: always()
        shell: bash
        run: |
          {
            echo "### Build log (tail 160)"
            echo '```'
            tail -n 160 build.log 2>/dev/null || echo "(no build.log)"
            echo '```'
            echo "### launcher/dist"
            ls -la launcher/dist 2>/dev/null || echo "(missing)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report build log to repo ci-logs/ (failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "run: ${GITHUB_RUN_ID}  ref: ${GITHUB_REF_NAME}  sha: ${GITHUB_SHA}"
            echo ""
            tail -n 150 build.log 2>/dev/null || echo "(no build.log captured)"
            echo ""
            echo "--- launcher/dist ---"
            ls -la launcher/dist 2>/dev/null || echo "(missing)"
          } > ci-build-report.txt
          B64=$(base64 -w0 ci-build-report.txt)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ci-logs/last-build.log" \
            -d "{\"message\":\"ci log ${GITHUB_RUN_ID}\",\"content\":\"${B64}\"}")
          echo "contents upload http: ${CODE}"
          cat ci-build-report.txt

      - name: Verify exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path "launcher\dist\OmniClash-Setup.exe")) {
            Write-Error "launcher/dist/OmniClash-Setup.exe was not produced"
            Get-ChildItem -Recurse launcher\dist | Format-Table
            exit 1
          }
          Get-Item "launcher\dist\OmniClash-Setup.exe" | Format-List Name, Length, FullName
          if (Test-Path "launcher\dist\OmniClash-Setup.exe.sha256") {
            Get-Content "launcher\dist\OmniClash-Setup.exe.sha256"
          }

      - name: Upload artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: OmniClash-Setup-windows
          path: |
            launcher/dist/OmniClash-Setup.exe
            launcher/dist/OmniClash-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${GITHUB_REF_NAME}" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            # manual run without tag: still build artifact only
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
          echo "create=${{ github.event_name == 'push' || inputs.create_release }}" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        if: steps.tag.outputs.tag != '' && (github.event_name == 'push' || inputs.create_release == true || inputs.create_release == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Create release if it does not exist yet
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "OMNI CLASH ${TAG#omni-v}" \
              --notes "$(cat <<'EOF'
          ## 🥊 OMNI CLASH — Marvel × DC Fan Fighter

          ### Windows installer
          1. Download **OmniClash-Setup.exe** from Assets below
          2. Double-click it → **Install**
          3. Open the **OMNI CLASH** Desktop shortcut → play

          ### Play in the browser (no install)
          Open `versions/omni-1.0.0/` on the repo (or GitHub Pages if enabled).

          ### Roster 1.0
          - 🕸️ **SPIDER-MAN** — FREE — Web Shot
          - 🦇 **BATMAN** — FREE — Batarang
          - 🤖 IRON MAN — locked (1.1)
          - ⚔️ WONDER WOMAN — locked (1.1)
          - 🃏 JOKER — locked (1.1)

          Modes: 1P vs CPU (Rookie/Hero/Legend) · 2 players local · best of 3.

          *Unofficial fan project. Character names belong to Marvel/DC —
          no assets copied, every pixel is drawn by code.*
          EOF
          )"
          fi
          gh release upload "$TAG" \
            "launcher/dist/OmniClash-Setup.exe" \
            --clobber
          if [ -f "launcher/dist/OmniClash-Setup.exe.sha256" ]; then
            gh release upload "$TAG" \
              "launcher/dist/OmniClash-Setup.exe.sha256" \
              --clobber || true
          fi
          gh release view "$TAG"
